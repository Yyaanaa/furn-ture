<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart | FURN TURE</title>
  <link href="https://fonts.cdnfonts.com/css/futura-std-4" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="cart.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="images/logo.PNG" alt="Furn Ture Logo" class="logo-img" />
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="header-icons">
        <a href="cart.html" class="icon"><i class="fa fa-shopping-cart"></i></a>
      </div>
    </div>
  </header>

  <main class="cart-container">
    <h1>Your Cart</h1>
    <div class="container-card"></div>

    <div class="cart-summary">
      <h2>Total: $<span id="cart-total">0.00</span></h2>
      <button class="checkout-btn">Proceed to Checkout</button>
    </div>
  </main>

  <script src="cart.js"></script>
</body>
</html>
